name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare Workers
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # wrangler.jsonc runs `pnpm run build` (the web app) as part of the deploy.
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          secrets: OAUTH_SECRET
          command: deploy
        env:
          OAUTH_SECRET: ${{ secrets.OAUTH_SECRET }}

      # wrangler-action reports custom domains as "host (custom domain)", without a protocol.
      - id: url
        env:
          DEPLOYED: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          url="${DEPLOYED%% *}"
          case "$url" in http*) ;; *) url="https://$url" ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
