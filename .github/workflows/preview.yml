name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# One preview per PR; a newer push supersedes a running deploy, but cleanup is never cancelled by a deploy.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy preview
    # Fork PRs get no secrets, so they cannot be deployed.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.preview.outputs.preview-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # A Cloudflare Worker Preview: its own deployment of this worker, with the settings of the `previews` block in
      # wrangler.jsonc. Previews inherit no secrets from production.
      - id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: preview --name pr-${{ github.event.pull_request.number }}

      # The secret is set per Preview (it makes a new deployment), so no Previews Base configuration is needed.
      # Previews get their own secret so a leaked preview cannot mint production tokens.
      - name: Set preview secret
        run: printf '%s' "$OAUTH_SECRET" | pnpm exec wrangler preview secret put OAUTH_SECRET --name "pr-$PR"
        env:
          PR: ${{ github.event.pull_request.number }}
          OAUTH_SECRET: ${{ secrets.PREVIEW_OAUTH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.preview-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error title=No preview URL::The Preview has no active URL. Is \`preview_urls\` deployed to production?"
            exit 1
          fi
          gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none --body "Preview deployed: $URL

          Commit: \`${SHA::7}\`. It is deleted when this PR is closed."

  cleanup:
    name: Delete preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm exec wrangler preview delete --name "pr-$PR" --skip-confirmation
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The environment itself cannot be deleted from here: that needs repository Administration (write), and
      # GITHUB_TOKEN has no `administration` permission (the old DELETE answered 403 and `|| true` hid it). What
      # `deployments: write` does allow is marking the deployments inactive, so the closed PR's preview stops
      # showing as live. The empty `preview-pr-N` entry stays in Settings > Environments.
      - name: Update comment and deactivate deployments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --edit-last --body "Preview deleted (PR closed)." || true

          environment="preview-pr-$PR"
          if ! ids=$(gh api --paginate "repos/$REPO/deployments?environment=$environment" --jq '.[].id'); then
            echo "::warning title=Deployments not deactivated::Could not list the deployments of $environment."
            exit 0
          fi

          count=0
          for id in $ids; do
            if gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive --silent; then
              count=$((count + 1))
            else
              echo "::warning title=Deployment not deactivated::Deployment $id of $environment could not be marked inactive."
            fi
          done
          echo "Marked $count deployment(s) of $environment inactive"
