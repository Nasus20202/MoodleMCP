name: CI

# Pull requests only: a push trigger as well would run everything twice for every PR branch.
# main is verified by the deploy workflow.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node, install dependencies
        uses: ./.github/actions/setup

      - name: Lint (ESLint and Prettier)
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check generated Worker types are up to date
        run: pnpm exec wrangler types --env-interface Env packages/server/worker-configuration.d.ts --check

      - name: Test
        run: pnpm test

      - name: Build and bundle (no upload)
        run: pnpm exec wrangler deploy --dry-run

  # Separate job so the slower browser tests run next to the checks above. deploy.yml reuses this workflow,
  # so a deploy waits for them too.
  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node, install dependencies
        uses: ./.github/actions/setup

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @moodle-mcp/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser cache
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @moodle-mcp/e2e exec playwright install --with-deps chromium

      # The system libraries are not part of the cache.
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @moodle-mcp/e2e exec playwright install-deps chromium

      - name: Run the browser tests
        run: pnpm run test:browser

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: packages/e2e/test-results
          retention-days: 7

  # The real coding-agent CLIs against the Worker, one job per CLI. A scripted model stands in for the model
  # provider, so nothing here needs an account or a secret. See packages/e2e/src/clients.
  clients:
    name: Client compatibility (${{ matrix.client }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        client: [claude, codex, opencode]
    env:
      E2E_CLIENTS: ${{ matrix.client }}
      # Fail when the CLI is missing instead of skipping its rows.
      E2E_REQUIRE_CLIENTS: '1'
      # renovate: datasource=npm depName=@anthropic-ai/claude-code
      CLAUDE_CODE_VERSION: 2.1.310
      # renovate: datasource=npm depName=@openai/codex
      CODEX_VERSION: 0.164.0
      # renovate: datasource=npm depName=@opencode/cli
      OPENCODE_VERSION: 2.1.4
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node, install dependencies
        uses: ./.github/actions/setup

      - name: Install Claude Code
        if: matrix.client == 'claude'
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Install Codex
        if: matrix.client == 'codex'
        run: npm install --global "@openai/codex@${CODEX_VERSION}"

      - name: Install opencode
        if: matrix.client == 'opencode'
        run: npm install --global "@opencode/cli@${OPENCODE_VERSION}"

      # The OAuth sign-ins are completed on the real consent page, in a browser. Same cache as the browser job.
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @moodle-mcp/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser cache
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @moodle-mcp/e2e exec playwright install --with-deps chromium

      # The system libraries are not part of the cache.
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @moodle-mcp/e2e exec playwright install-deps chromium

      - name: Run the client matrix
        run: pnpm run test:clients
