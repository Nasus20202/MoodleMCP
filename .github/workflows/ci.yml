name: CI

# Pull requests only: a push trigger as well would run everything twice for every PR branch.
# main is verified by the deploy workflow.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint and Prettier)
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check generated Worker types are up to date
        run: pnpm exec wrangler types --env-interface Env packages/server/worker-configuration.d.ts --check

      - name: Test
        run: pnpm test

      - name: Build and bundle (no upload)
        run: pnpm exec wrangler deploy --dry-run
