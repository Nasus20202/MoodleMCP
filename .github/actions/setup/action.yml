name: Set up pnpm and Node
description: Installs the pnpm and Node versions the repository pins, then the locked dependencies. Run after checkout.

runs:
  using: composite
  steps:
    # Reads the pnpm version from "packageManager" in package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

    - name: Install Node and cache the pnpm store
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
